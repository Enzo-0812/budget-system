<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预算管控系统</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
    body{background:#f0f4f8;min-height:100vh}
    .center-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:100%;max-width:420px;padding:30px}
    h1{text-align:center;font-size:22px;color:#1e293b;margin-bottom:25px}
    .form-item{margin-bottom:18px}
    label{display:block;font-size:14px;color:#475569;margin-bottom:6px}
    input,select,textarea{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
    .btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px}
    .btn:hover{background:#1d4ed8}
    .tip{text-align:center;font-size:12px;color:#94a3b8;margin-top:16px}
    .hidden{display:none !important}
    header{background:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .container{max-width:1200px;margin:20px auto;padding:0 20px}
    .section{background:#fff;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    h2{font-size:18px;margin-bottom:18px;color:#334155}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .row-full{grid-column:1/-1}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
    th{background:#f8fafc}
    .btn-sm{padding:6px 12px;background:#f1f5f9;border:none;border-radius:4px;cursor:pointer;margin-left:6px}
    .btn-danger{background:#fee2e2;color:#b91c1c}
    .msg{padding:12px;border-radius:6px;margin-top:15px;display:none}
    .msg.success{background:#f0fdf4;color:#166534;display:block}
    .msg.error{background:#fef2f2;color:#991b1b;display:block}
    .warn{background:#fffbeb;color:#b45309;padding:10px;border-radius:6px;margin-top:10px}
    .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .dash-card{border:1px solid #e2e8f0;border-radius:8px;padding:16px}
    .bar{height:8px;background:#e2e8f0;border-radius:4px;margin-top:8px;overflow:hidden}
    .bar-fill{height:100%}
    .bar-green{background:#16a34a}
    .bar-yellow{background:#f59e0b}
    .bar-red{background:#dc2626}
    .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:10px 18px;background:#f1f5f9;border-radius:6px;cursor:pointer;border:none;font-size:14px}
    .tab.active{background:#2563eb;color:#fff}
    .cat-group{border:1px solid #e2e8f0;border-radius:8px;padding:15px;margin-bottom:15px}
    .cat-group h3{font-size:15px;margin-bottom:12px;color:#475569}
    .rate-good{color:#16a34a}
    .rate-warn{color:#f59e0b}
    .rate-bad{color:#dc2626}
  </style>
</head>
<body>
  <div id="loginPage" class="center-page">
    <div class="card">
      <h1>💰 预算管控系统</h1>
      <form id="loginForm">
        <div class="form-item">
          <label>账号</label>
          <input type="text" id="username" value="admin" />
        </div>
        <div class="form-item">
          <label>密码</label>
          <input type="password" id="password" value="123456" />
        </div>
        <button type="submit" class="btn">登录系统</button>
        <p class="tip">默认账号：admin / 123456</p>
      </form>
    </div>
  </div>

  <div id="mainPage" class="hidden">
    <header>
      <h1>💰 预算管控系统</h1>
      <div>
        <span id="userInfo"></span>
        <button onclick="openChangePwd()" class="btn-sm">修改密码</button>
        <button onclick="exportExcel()" class="btn-sm">导出Excel</button>
        <button onclick="logout()" class="btn-sm">退出</button>
      </div>
    </header>
    <div class="container">
      <div class="tabs">
        <button class="tab active" data-view="apply">预算申请</button>
        <button class="tab" data-view="budget">预算设置</button>
      </div>

      <div id="v-apply">
        <div class="section">
          <h2>📊 预算总览（单位：万美元）</h2>
          <div id="dashboard"></div>
        </div>
        <div class="section">
          <h2>✍️ 提交申请（单位：万美元）</h2>
          <form id="applyForm">
            <div class="row">
              <div class="form-item">
                <label>所属部门</label>
                <select id="deptSel" required onchange="updateCatOptions()"></select>
              </div>
              <div class="form-item">
                <label>预算科目</label>
                <select id="catSel" required></select>
              </div>
            </div>
            <div class="row">
              <div class="form-item">
                <label>申请金额（万美元）</label>
                <input type="number" id="amount" step="0.01" min="0.01" required placeholder="例如：1.23" />
              </div>
            </div>
            <div class="form-item row-full">
              <label>用途说明</label>
              <textarea id="purpose" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn" style="width:auto">提交申请</button>
            <div id="applyMsg" class="msg"></div>
          </form>
        </div>
        <div class="section">
          <h2>📋 申请记录（单位：万美元）</h2>
          <table>
            <thead>
              <tr>
                <th>申请单号</th>
                <th>部门</th>
                <th>科目</th>
                <th>金额(万美元)</th>
                <th>状态</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </div>

      <div id="v-budget" class="hidden">
        <div class="section">
          <h2>💰 预算设置（单位：万美元）</h2>
          <form id="budgetForm" class="row">
            <div class="form-item">
              <label>所属部门</label>
              <select id="bd" required onchange="updateBudgetCatOptions()"></select>
            </div>
            <div class="form-item">
              <label>预算科目</label>
              <select id="bc" required></select>
            </div>
            <div class="form-item">
              <label>预算总额（万美元）</label>
              <input type="number" id="bt" step="0.01" min="0" required placeholder="如 326.02" />
            </div>
            <div class="form-item">
              <label>预警线(%)</label>
              <input type="number" id="bw" value="80" min="1" max="100" required />
            </div>
            <div class="row-full">
              <button type="submit" class="btn" style="width:auto">保存预算</button>
              <p id="initTip" style="color:#2563eb;margin-top:8px"></p>
            </div>
          </form>
          
          <h3 style="margin:25px 0 15px">📋 已设置预算一览</h3>
          
          <div class="cat-group">
            <h3>管理费用</h3>
            <table>
              <thead>
                <tr>
                  <th>部门</th>
                  <th>科目</th>
                  <th>预算总额(万美元)</th>
                  <th>已用(万美元)</th>
                  <th>完成率</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="budgetAdminTable"></tbody>
            </table>
          </div>
          
          <div class="cat-group">
            <h3>销售费用（经营开发中心）</h3>
            <table>
              <thead>
                <tr>
                  <th>部门</th>
                  <th>科目</th>
                  <th>预算总额(万美元)</th>
                  <th>已用(万美元)</th>
                  <th>完成率</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="budgetSalesTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

<div id="resetPanel" style="position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.1);z-index:9999">
  <h4 style="margin:0 0 10px;font-size:14px">🔧 系统修复</h4>
  <button onclick="resetDatabase()" style="padding:8px 15px;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer">重置数据库并重建</button>
  <p id="resetResult" style="margin:10px 0 0;font-size:12px;color:#666"></p>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('token');
let user = null;

const DEPARTMENTS = [
  { id: 'zonghe', name: '综合部' },
  { id: 'shangwu', name: '商务部' },
  { id: 'gongcheng', name: '工程部' },
  { id: 'anzhi', name: '安质部' },
  { id: 'caiwu', name: '财务部' },
  { id: 'qihua', name: '企化部' },
  { id: 'jingying', name: '经营开发中心' }
];

const CATEGORIES_ADMIN = [
  { id: 'staff_pay', name: '职工薪酬' },
  { id: 'salary_total', name: '工资总额' },
  { id: 'welfare', name: '福利费用' },
  { id: 'fixed_asset_dep', name: '固定资产折旧' },
  { id: 'low_value_amort', name: '低值易耗品摊销' },
  { id: 'travel', name: '差旅费' },
  { id: 'office', name: '办公费' },
  { id: 'rent', name: '租赁费' },
  { id: 'agency', name: '中介费用' },
  { id: 'pollution_fee', name: '排污绿化费' },
  { id: 'property_fee', name: '物业管理费' },
  { id: 'vehicle_fee', name: '车辆费用' },
  { id: 'conference', name: '会议费' },
  { id: 'labor_insurance', name: '劳保费' },
  { id: 'other_admin', name: '其他' }
];

const CATEGORIES_SALES = [
  { id: 'staff_pay_s', name: '职工薪酬' },
  { id: 'salary_total_s', name: '工资总额' },
  { id: 'welfare_s', name: '福利费用' },
  { id: 'office_s', name: '办公费' },
  { id: 'transport_s', name: '交通费' },
  { id: 'travel_s', name: '差旅费' },
  { id: 'entertainment_s', name: '业务招待费' },
  { id: 'rent_s', name: '租赁费用' },
  { id: 'labor_insurance_s', name: '劳保费' },
  { id: 'other_sales', name: '其他' }
];

let deptMap = {};
DEPARTMENTS.forEach(d => { deptMap[d.id] = d.name; });

if (token) enterMain();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const res = await fetch(API+'/login', {
      method:'POST', 
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    
    const d = await res.json();
    
    if (!res.ok) {
      alert(d.msg || '登录失败');
      return;
    }
    
    token = d.token; 
    localStorage.setItem('token', token);
    try { 
      user = JSON.parse(atob(token.split('.')[1])); 
    } catch {
      user = { username: d.name, name: d.name, role: 'user' };
    }
    
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    
    document.getElementById('userInfo').textContent = user?.name || user?.username || '用户';
    
    const deptSelHTML = DEPARTMENTS.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    document.getElementById('deptSel').innerHTML = deptSelHTML;
    document.getElementById('bd').innerHTML = deptSelHTML;
    
    updateCatOptions();
    updateBudgetCatOptions();
    
    await loadAll();
    
  } catch (err) {
    alert('网络错误，请刷新页面试试');
    console.error(err);
  }
});

function logout() { localStorage.clear(); location.reload(); }

function updateCatOptions() {
  const deptId = document.getElementById('deptSel').value;
  const catSel = document.getElementById('catSel');
  catSel.innerHTML = '';
  const cats = deptId === 'jingying' ? CATEGORIES_SALES : CATEGORIES_ADMIN;
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    catSel.appendChild(opt);
  });
}

function updateBudgetCatOptions() {
  const deptId = document.getElementById('bd').value;
  const catSel = document.getElementById('bc');
  catSel.innerHTML = '';
  const cats = deptId === 'jingying' ? CATEGORIES_SALES : CATEGORIES_ADMIN;
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    catSel.appendChild(opt);
  });
}

async function loadAll() {
  try {
    const [budgets, reqs] = await Promise.all([
      fetch(API+'/budgets', {headers:{Authorization:'Bearer '+token}}).then(r=>r.json()),
      fetch(API+'/requests', {headers:{Authorization:'Bearer '+token}}).then(r=>r.json())
    ]);

    if (budgets.length === 0) {
      document.getElementById('initTip').textContent = '💡 首次使用：保存任意一条预算后，系统会自动导入全部预设数据';
    } else {
      document.getElementById('initTip').textContent = '';
    }

    renderDashboard(budgets);
    renderBudgetTable(budgets);

    document.getElementById('records').innerHTML = reqs.length ? reqs.map(r => {
      const amountWan = (+r.amount / 10000).toFixed(2);
      const catName = getCatName(r.category);
      return `
      <tr>
        <td>${r.request_no}</td>
        <td>${deptMap[r.dept_id] || r.dept_id}</td>
        <td>${catName}</td>
        <td>$${amountWan} 万</td>
        <td><span style="color:#16a34a">已通过</span></td>
        <td>${(r.created_at || '').slice(0, 16)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:15px">暂无记录</td></tr>';

  } catch (err) {
    console.error('加载失败：', err);
  }
}

function getCatName(catId) {
  const all = [...CATEGORIES_ADMIN, ...CATEGORIES_SALES];
  const c = all.find(x => x.id === catId);
  return c ? c.name : catId;
}

function renderDashboard(budgets) {
  const dash = document.getElementById('dashboard');
  dash.innerHTML = '';
  
  DEPARTMENTS.forEach(dept => {
    const deptBudgets = budgets.filter(b => b.dept_id === dept.id);
    if (deptBudgets.length === 0) return;
    
    const total = deptBudgets.reduce((sum, b) => sum + +b.total_amount, 0);
    const used = deptBudgets.reduce((sum, b) => sum + +b.used_amount, 0);
    const pct = total > 0 ? (used / total * 100) : 0;
    const totalWan = (total / 10000).toFixed(2);
    const usedWan = (used / 10000).toFixed(2);
    const cls = pct >= 90 ? 'bar-red' : pct >= 80 ? 'bar-yellow' : 'bar-green';
    
    dash.innerHTML += `
      <div class="dash-card">
        <h3 style="font-size:15px;color:#475569;margin-bottom:8px">${dept.name}</h3>
        <p style="font-size:20px;font-weight:bold">$${usedWan} / ${totalWan} 万</p>
        <p style="font-size:13px;color:#64748b;margin:4px 0 8px">使用率 ${pct.toFixed(1)}%</p>
        <div class="bar"><div class="bar-fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div>
      </div>`;
  });
  
  if (!dash.innerHTML) {
    dash.innerHTML = '<p style="color:#94a3b8;padding:20px;text-align:center">请先在「预算设置」中填写预算</p>';
  }
}

function renderBudgetTable(budgets) {
  const adminIds = CATEGORIES_ADMIN.map(c => c.id);
  const adminBudgets = budgets.filter(b => adminIds.includes(b.category));
  document.getElementById('budgetAdminTable').innerHTML = adminBudgets.length 
    ? adminBudgets.map(b => renderBudgetRow(b)).join('')
    : '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:15px">暂未设置</td></tr>';
  
  const salesIds = CATEGORIES_SALES.map(c => c.id);
  const salesBudgets = budgets.filter(b => salesIds.includes(b.category));
  document.getElementById('budgetSalesTable').innerHTML = salesBudgets.length 
    ? salesBudgets.map(b => renderBudgetRow(b)).join('')
    : '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:15px">暂未设置</td></tr>';
}

function renderBudgetRow(b) {
  const totalWan = (+b.total_amount / 10000).toFixed(2);
  const usedWan = (+b.used_amount / 10000).toFixed(2);
  const pct = +b.total_amount > 0 ? (+b.used_amount / +b.total_amount * 100) : 0;
  const warnRate = +b.warning_rate || 80;
  
  let rateClass = 'rate-good';
  let statusText = '正常';
  if (pct >= warnRate) { rateClass = 'rate-warn'; statusText = '预警'; }
  if (pct >= 90) { rateClass = 'rate-bad'; statusText = '超支风险'; }
  
  const catName = getCatName(b.category);
  
  return `
    <tr>
      <td>${deptMap[b.dept_id] || b.dept_id}</td>
      <td>${catName}</td>
      <td>$${totalWan}</td>
      <td>$${usedWan}</td>
      <td class="${rateClass}">${pct.toFixed(1)}%</td>
      <td class="${rateClass}">${statusText}</td>
    </tr>`;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const view = tab.dataset.view;
    ['apply', 'budget'].forEach(v => {
      document.getElementById('v-' + v).classList.toggle('hidden', v !== view);
    });
  });
});

document.getElementById('applyForm').addEventListener('submit', async e => {
  e.preventDefault();
  const amountWan = +document.getElementById('amount').value;
  const amountYuan = Math.round(amountWan * 10000);
  
  const res = await fetch(API+'/requests', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
    body:JSON.stringify({
      dept: document.getElementById('deptSel').value,
      category: document.getElementById('catSel').value,
      amount: amountYuan,
      purpose: document.getElementById('purpose').value
    })
  });
  const d = await res.json();
  const box = document.getElementById('applyMsg');
  box.className = 'msg ' + (d.ok ? 'success' : 'error');
  
  const remainWan = ((d.remain || 0) / 10000).toFixed(2);
  box.textContent = d.ok 
    ? `✅ 通过！申请单号：${d.no}，剩余额度：$${remainWan} 万${d.warn ? '\n⚠️ ' + d.warn : ''}`
    : `❌ ${d.msg || '提交失败'}`;
  
  loadAll();
  e.target.reset();
});

document.getElementById('budgetForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (user?.role !== 'admin') return alert('仅管理员可操作');
  
  const totalWan = +document.getElementById('bt').value;
  const totalYuan = Math.round(totalWan * 10000);
  
  const res = await fetch(API+'/budgets', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
    body:JSON.stringify({
      dept_id: document.getElementById('bd').value,
      category_id: document.getElementById('bc').value,
      total_amount: totalYuan,
      warning_rate: +document.getElementById('bw').value
    })
  });
  
  const d = await res.json();
  alert(d.ok ? '保存成功！' : '保存失败');
  loadAll();
});

async function openChangePwd() {
  const oldPwd = prompt('请输入原密码：');
  if (!oldPwd) return;
  const newPwd = prompt('请输入新密码（至少6位）：');
  if (!newPwd || newPwd.length < 6) return alert('密码至少6位');
  const confirmPwd = prompt('请再次输入新密码：');
  if (newPwd !== confirmPwd) return alert('两次输入不一致');
  
  const res = await fetch('/user/password', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
    body:JSON.stringify({oldPwd, newPwd, confirmPwd})
  });
  const d = await res.json();
  alert(d.msg);
  if (d.success) logout();
}

function exportExcel() {
  const a = document.createElement('a');
  a.href = API + '/export/excel';
  a.download = '预算申请记录_' + new Date().toLocaleDateString() + '.csv';
  a.click();
}

async function resetDatabase() {
  if (!confirm('确定要重置吗？会清除旧数据重新生成初始内容！')) return;
  const res = await fetch('/api/admin/reset-db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ secret: 'reset-2026' })
  });
  const d = await res.json();
  document.getElementById('resetResult').textContent = d.msg || d.error || '操作完成';
  document.getElementById('resetResult').style.color = d.ok ? '#16a34a' : '#dc2626';
  if (d.ok) setTimeout(() => location.reload(), 1500);
}
</script>
</body>
</html>

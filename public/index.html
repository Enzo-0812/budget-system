<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预算管控系统</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
    body{background:#f0f4f8;min-height:100vh}
    .center-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:100%;max-width:420px;padding:30px}
    h1{text-align:center;font-size:22px;color:#1e293b;margin-bottom:25px}
    .form-item{margin-bottom:18px}
    label{display:block;font-size:14px;color:#475569;margin-bottom:6px}
    input,select,textarea{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
    .btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px}
    .btn:hover{background:#1d4ed8}
    .tip{text-align:center;font-size:12px;color:#94a3b8;margin-top:16px}
    .hidden{display:none !important}
    header{background:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .container{max-width:1200px;margin:20px auto;padding:0 20px}
    .section{background:#fff;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    h2{font-size:18px;margin-bottom:18px;color:#334155}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .row-full{grid-column:1/-1}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
    th{background:#f8fafc}
    .btn-sm{padding:6px 12px;background:#f1f5f9;border:none;border-radius:4px;cursor:pointer;margin-left:6px}
    .btn-danger{background:#fee2e2;color:#b91c1c}
    .msg{padding:12px;border-radius:6px;margin-top:15px;display:none}
    .msg.success{background:#f0fdf4;color:#166534;display:block}
    .msg.error{background:#fef2f2;color:#991b1b;display:block}
    .warn{background:#fffbeb;color:#b45309;padding:10px;border-radius:6px;margin-top:10px}
    .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
    .dash-card{border:1px solid #e2e8f0;border-radius:8px;padding:16px}
    .bar{height:8px;background:#e2e8f0;border-radius:4px;margin-top:8px;overflow:hidden}
    .bar-fill{height:100%}
    .bar-green{background:#16a34a}
    .bar-yellow{background:#f59e0b}
    .bar-red{background:#dc2626}
    .tabs{display:flex;gap:10px;margin-bottom:20px}
    .tab{padding:8px 16px;background:#f1f5f9;border-radius:6px;cursor:pointer;border:none}
    .tab.active{background:#2563eb;color:#fff}
  </style>
</head>
<body>
  <div id="loginPage" class="center-page">
    <div class="card">
      <h1>💰 预算管控系统</h1>
      <form id="loginForm">
        <div class="form-item">
          <label>账号</label>
          <input type="text" id="username" value="admin" />
        </div>
        <div class="form-item">
          <label>密码</label>
          <input type="password" id="password" value="123456" />
        </div>
        <button type="submit" class="btn">登录系统</button>
        <p class="tip">默认账号：admin / 123456</p>
      </form>
    </div>
  </div>

  <div id="mainPage" class="hidden">
    <header>
      <h1>💰 预算管控系统</h1>
      <div>
        <span id="userInfo"></span>
        <button onclick="openChangePwd()" class="btn-sm">修改密码</button>
        <button onclick="exportExcel()" class="btn-sm">导出Excel</button>
        <button onclick="logout()" class="btn-sm">退出</button>
      </div>
    </header>
    <div class="container">
      <div class="tabs">
        <button class="tab active" data-view="apply">预算申请</button>
        <button class="tab" data-view="dept">部门管理</button>
        <button class="tab" data-view="cat">科目管理</button>
        <button class="tab" data-view="budget">预算设置</button>
      </div>

      <div id="v-apply">
        <div class="section">
          <h2>📊 预算总览</h2>
          <div id="dashboard" class="dash-grid"></div>
        </div>
        <div class="section">
          <h2>✍️ 提交申请</h2>
          <form id="applyForm">
            <div class="row">
              <div class="form-item">
                <label>所属部门</label>
                <select id="deptSel" required></select>
              </div>
              <div class="form-item">
                <label>预算科目</label>
                <select id="catSel" required></select>
              </div>
            </div>
            <div class="row">
              <div class="form-item">
                <label>申请金额(元)</label>
                <input type="number" id="amount" step="0.01" min="0.01" required />
              </div>
            </div>
            <div class="form-item row-full">
              <label>用途说明</label>
              <textarea id="purpose" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn">提交申请</button>
            <div id="applyMsg" class="msg"></div>
          </form>
        </div>
        <div class="section">
          <h2>📋 申请记录</h2>
          <table><thead><tr><th>申请单号</th><th>部门</th><th>科目</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody id="records"></tbody></table>
        </div>
      </div>

      <div id="v-dept" class="hidden">
        <div class="section">
          <h2>🏢 部门管理</h2>
          <form id="deptForm" class="row">
            <div class="form-item"><label>部门ID</label><input type="text" id="deptId" required /></div>
            <div class="form-item"><label>部门名称</label><input type="text" id="deptName" required /></div>
            <div class="row-full"><button type="submit" class="btn" style="width:auto">保存部门</button></div>
          </form>
          <table><thead><tr><th>ID</th><th>名称</th><th>操作</th></tr></thead><tbody id="deptList"></tbody></table>
        </div>
      </div>

      <div id="v-cat" class="hidden">
        <div class="section">
          <h2>📑 科目管理</h2>
          <form id="catForm" class="row">
            <div class="form-item"><label>科目ID</label><input type="text" id="catId" required /></div>
            <div class="form-item"><label>科目名称</label><input type="text" id="catName" required /></div>
            <div class="row-full"><button type="submit" class="btn" style="width:auto">保存科目</button></div>
          </form>
          <table><thead><tr><th>ID</th><th>名称</th><th>操作</th></tr></thead><tbody id="catList"></tbody></table>
        </div>
      </div>

      <div id="v-budget" class="hidden">
        <div class="section">
          <h2>💰 预算设置</h2>
          <form id="budgetForm" class="row">
            <div class="form-item"><label>部门</label><select id="bd" required></select></div>
            <div class="form-item"><label>科目</label><select id="bc" required></select></div>
            <div class="form-item"><label>总额(元)</label><input type="number" id="bt" step="0.01" required /></div>
            <div class="form-item"><label>预警线(%)</label><input type="number" id="bw" value="80" required /></div>
            <div class="row-full"><button type="submit" class="btn" style="width:auto">保存预算</button></div>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
const API = '/api';
let token = localStorage.getItem('token');
let user = null;
let deptMap = {}, catMap = {};

if (token) enterMain();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const res = await fetch(API+'/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:document.getElementById('username').value,
      password:document.getElementById('password').value
    })
  });
  const d = await res.json();
  if (!res.ok) return alert(d.msg);
  token = d.token; localStorage.setItem('token',token);
  try { user = JSON.parse(atob(token.split('.')[1])); }catch{}
  enterMain();
});

function logout() { localStorage.clear(); location.reload(); }

async function enterMain() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainPage').classList.remove('hidden');
  document.getElementById('userInfo').textContent = user?.name || user?.username || '用户';
  await loadAll();
}

async function loadAll() {
  const [depts,cats,budgets,reqs] = await Promise.all([
    fetch(API+'/depts',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()),
    fetch(API+'/categories',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()),
    fetch(API+'/budgets',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()),
    fetch(API+'/requests',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json())
  ]);
  depts.forEach(d=>deptMap[d.dept_id]=d.display_name);
  cats.forEach(c=>catMap[c.cat_id]=c.display_name);

  const ds = document.getElementById('deptSel'); ds.innerHTML=''; depts.forEach(d=>ds.innerHTML+=`<option value="${d.dept_id}">${d.display_name}</option>`);
  const cs = document.getElementById('catSel'); cs.innerHTML=''; cats.forEach(c=>cs.innerHTML+=`<option value="${c.cat_id}">${c.display_name}</option>`);
  document.getElementById('bd').innerHTML=ds.innerHTML;
  document.getElementById('bc').innerHTML=cs.innerHTML;

  const dash = document.getElementById('dashboard'); dash.innerHTML='';
  const group = {};
  budgets.forEach(b=>{
    if(!group[b.dept_id]) group[b.dept_id]={total:0,used:0};
    group[b.dept_id].total += +b.total_amount;
    group[b.dept_id].used += +b.used_amount;
  });
  for(const [id,v] of Object.entries(group)){
    const pct = v.used/v.total*100||0;
    const cls = pct>=90?'bar-red':pct>=80?'bar-yellow':'bar-green';
    dash.innerHTML += `<div class="dash-card"><h3>${deptMap[id]||id}</h3><p style="font-size:20px;font-weight:bold;margin:6px 0">¥${v.used.toLocaleString()} / ${v.total.toLocaleString()}</p><p style="font-size:12px;color:#64748b">使用率${pct.toFixed(1)}%</p><div class="bar"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div></div>`;
  }

  document.getElementById('deptList').innerHTML = depts.map(d=>`<tr><td>${d.dept_id}</td><td>${d.display_name}</td><td>${user?.role==='admin'?`<button class="btn-sm btn-danger" onclick="delDept('${d.dept_id}')">删除</button>`:'无权限'}</td></tr>`).join('');
  document.getElementById('catList').innerHTML = cats.map(c=>`<tr><td>${c.cat_id}</td><td>${c.display_name}</td><td>${user?.role==='admin'?`<button class="btn-sm btn-danger" onclick="delCat('${c.cat_id}')">删除</button>`:'无权限'}</td></tr>`).join('');
  document.getElementById('records').innerHTML = reqs.length?reqs.map(r=>`<tr><td>${r.request_no}</td><td>${deptMap[r.dept_id]||r.dept_id}</td><td>${catMap[r.category]||r.category}</td><td>¥${(+r.amount).toFixed(2)}</td><td><span style="color:#16a34a">已通过</span></td><td>${(r.created_at||'').slice(0,16)}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:#94a3b8">暂无记录</td></tr>';
}

document.getElementById('applyForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const res = await fetch(API+'/requests',{
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({
      dept:document.getElementById('deptSel').value,
      category:document.getElementById('catSel').value,
      amount:+document.getElementById('amount').value,
      purpose:document.getElementById('purpose').value
    })
  });
  const d = await res.json();
  const box = document.getElementById('applyMsg');
  box.className = 'msg '+(d.ok?'success':'error');
  box.textContent = d.ok?`✅ 通过！单号${d.no}，剩余¥${d.remain.toFixed(2)}${d.warn?'\n'+d.warn:''}`:`❌ ${d.msg}`;
  loadAll(); e.target.reset();
});

document.getElementById('deptForm').addEventListener('submit',async e=>{
  e.preventDefault();
  await fetch(API+'/depts',{
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({dept_id:document.getElementById('deptId').value,display_name:document.getElementById('deptName').value})
  });
  document.getElementById('deptId').value='';document.getElementById('deptName').value='';
  loadAll();
});
document.getElementById('catForm').addEventListener('submit',async e=>{
  e.preventDefault();
  await fetch(API+'/categories',{
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({cat_id:document.getElementById('catId').value,display_name:document.getElementById('catName').value})
  });
  document.getElementById('catId').value='';document.getElementById('catName').value='';
  loadAll();
});
document.getElementById('budgetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  await fetch(API+'/budgets',{
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({
      dept_id:document.getElementById('bd').value,
      category_id:document.getElementById('bc').value,
      total_amount:+document.getElementById('bt').value,
      warning_rate:+document.getElementById('bw').value
    })
  });
  loadAll(); alert('保存成功');
});

window.delDept = async id => { if(!confirm('确定删除？'))return; await fetch(`${API}/depts/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+token}}); loadAll(); };
window.delCat = async id => { if(!confirm('确定删除？'))return; await fetch(`${API}/categories/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+token}}); loadAll(); };

function openChangePwd() {
  const oldPwd = prompt('请输入原密码：'); if(!oldPwd) return;
  const newPwd = prompt('新密码（至少6位）：'); if(!newPwd) return;
  const confirmPwd = prompt('确认新密码：'); if(!confirmPwd) return;
  fetch('/user/password',{
    method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({oldPwd,newPwd,confirmPwd})
  }).then(r=>r.json()).then(d=>{alert(d.msg);if(d.success)logout();});
}

function exportExcel() {
  const a = document.createElement('a');
  a.href = API+'/export/excel';
  a.download = '预算导出.csv';
  a.click();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const v = t.dataset.view;
    ['apply','dept','cat','budget'].forEach(k=>document.getElementById('v-'+k).classList.toggle('hidden',k!==v));
  });
});
</script>
</body>
</html>
